# Builds the desktop installers and publishes them as a GitHub Release.
# Trigger: bump "version" in package.json, then push a matching tag:
#   git tag v0.1.1 && git push origin v0.1.1
# The web app's "Get the desktop app" button links to the latest release assets:
#   DonkeyBillabongDJ-Setup.exe (Windows) and DonkeyBillabongDJ-macOS.dmg (macOS, universal)
#
# Each OS builds without publishing; a final job creates the release and attaches
# whatever was built, so one platform failing never blocks the other's download.
name: Release desktop app

on:
  push:
    tags: ["v*"]
    # Build-only check (no release) when the release pipeline itself changes.
    branches: [main]
    paths: [".github/workflows/release.yml", "package.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: windows
          - os: macos-latest
            target: --mac
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build installer
        shell: bash
        run: |
          set -o pipefail
          # Unset signing variables whose secrets are missing: an empty CSC_LINK is
          # resolved to the working directory by electron-builder ("… not a file").
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if ! npx electron-builder ${{ matrix.target }} --publish never 2>&1 | tee build.log; then
            # Surface the failure as public annotations (job logs need repo access to read).
            grep -E "⨯|rror|failed|Exception" build.log | tail -25 | while IFS= read -r line; do echo "::error title=electron-builder::${line}"; done
            exit 1
          fi
        env:
          # Optional code signing — add these repository secrets to remove OS warnings:
          #   Windows: CSC_LINK (base64 .pfx) + CSC_KEY_PASSWORD
          #   macOS:   CSC_LINK (Developer ID .p12) + CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
      - name: List output
        shell: bash
        run: ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest*.yml

  release:
    needs: build
    # Publish whatever built successfully, even if one platform failed (tags only).
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Donkey Billabong DJ ${{ github.ref_name }}
          make_latest: true
          fail_on_unmatched_files: false
          files: artifacts/*
          body: |
            **Windows:** download `DonkeyBillabongDJ-Setup.exe`, run it — if SmartScreen appears choose *More info → Run anyway* (the app isn't code-signed yet).
            **macOS:** download `DonkeyBillabongDJ-macOS.dmg`, drag the app to Applications, then right-click → *Open* the first time (not notarised yet).
            Close Serato / rekordbox / Mixxx before connecting a DDJ-SB.
